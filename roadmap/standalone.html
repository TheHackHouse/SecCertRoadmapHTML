<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cyber Security Certifications Map 2026</title>
    <link rel="stylesheet" href="css/roadmap.css">
</head>
<body>
    <header class="rm-header">
        <div class="rm-titlebar">
            <h1 id="rm-title">Cyber Security Certifications Map 2026</h1>
            <span id="rm-scope"></span>
            <span id="rm-note"></span>
        </div>
        <div class="rm-controls">
            <label>Chart <select id="rm-chart"></select></label>
            <label>View <select id="rm-view"></select></label>
            <button type="button" id="rm-back" hidden>&larr; Cyber View</button>
            <label>Size <select id="rm-size"><option value="fit">Fit to window</option><option value="large">Large (scroll)</option><option value="xl">Extra large (scroll)</option></select></label>
            <label>Search <input type="search" id="rm-search" placeholder="name, vendor, topic"></label>
        </div>
        <div class="rm-controls">
            <label>Max price (USD) <input type="number" id="rm-max" min="0" step="50" placeholder="any"></label>
            <input type="range" id="rm-range" min="0" max="10000" step="50" aria-label="Maximum price">
            <label><input type="checkbox" id="rm-unknown" checked> Include entries with no published price</label>
            <button type="button" id="rm-reset">Reset</button>
            <span id="rm-count" aria-live="polite"></span>
        </div>
    </header>
    <div id="rm-warn" class="rm-warn" hidden></div>
    <main>
        <div id="rm-wrap"><div id="rm-grid" class="rm-grid"></div></div>
        <details id="rm-list">
            <summary>List view <span id="rm-list-count"></span></summary>
            <table class="rm-table">
                <thead><tr><th>Level</th><th>Short name</th><th>Name</th><th>Area</th><th>Price / notes</th></tr></thead>
                <tbody id="rm-list-body"></tbody>
            </table>
        </details>
    </main>
    <footer>
        <span id="rm-footer-count"></span>
        <span class="rm-links">Click a domain or sub-domain title to focus on it. Prices are approximate and converted to USD for filtering only.
            Data: <code>roadmap/data/</code> &middot; Licence: CC BY-SA 4.0</span>
    </footer>
    <div id="rm-tip" role="tooltip" hidden></div>

    <script src="data/taxonomy.js"></script>
    <script src="data/certifications.js"></script>
    <script src="data/training.js"></script>
    <script src="data/retired.js"></script>
    <script src="js/roadmap.js"></script>
</body>
</html>
